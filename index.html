<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DMassanger</title>
  <style>
    :root {
      --primary: #00796b; --bg: #e0f2f1; --chat-bg: #ffffff;
      --my-msg: #b2dfdb; --other-msg: #f1f8e9;
    }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg); justify-content: center; align-items: center; }
    
    /* Экраны входа */
    #auth-screen { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .logo { font-size: 48px; margin-bottom: 10px; }
    .title { color: var(--primary); font-size: 24px; margin-bottom: 20px; font-weight: bold; }
    #auth-screen input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px; }
    #auth-screen button { width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-bottom: 10px; }
    .link { color: var(--primary); cursor: pointer; text-decoration: underline; font-size: 14px; }

    /* Основной интерфейс */
    #app { display: none; width: 100%; height: 100%; }
    .sidebar { width: 250px; background: var(--primary); color: white; display: flex; flex-direction: column; }
    .sidebar h3 { padding: 15px; margin: 0; border-bottom: 1px solid #004d40; }
    .user-list { overflow-y: auto; flex: 1; }
    .user-item { padding: 15px; cursor: pointer; border-bottom: 1px solid #004d40; transition: background 0.2s; }
    .user-item:hover, .user-item.active { background: #004d40; }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
    .chat-header { padding: 15px; background: white; border-bottom: 1px solid #ccc; font-weight: bold; font-size: 18px; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    
    .message { max-width: 70%; padding: 10px; border-radius: 10px; position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; word-break: break-word; }
    .message.my { align-self: flex-end; background: var(--my-msg); }
    .message.other { align-self: flex-start; background: var(--other-msg); }
    .delete-btn { cursor: pointer; opacity: 0.5; font-size: 12px; }
    .delete-btn:hover { opacity: 1; color: red; }
    .system-msg { text-align: center; color: gray; font-size: 12px; margin: 5px 0; }

    .input-area { display: flex; padding: 15px; background: white; border-top: 1px solid #ccc; }
    .input-area input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-right: 10px; }
    .input-area button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="logo">🐱</div>
  <div class="title">DMassanger</div>
  <input id="username" placeholder="Имя пользователя">
  <input id="password" type="password" placeholder="Пароль">
  <button onclick="login()">Войти</button>
  <div class="link" onclick="register()">Нет аккаунта? Зарегистрироваться</div>
  <div id="auth-error" style="color: red; margin-top: 10px; font-size: 14px;"></div>
</div>

<div id="app">
  <div class="sidebar">
    <h3>Чаты</h3>
    <div class="user-list" id="userList">
      <div class="user-item active" onclick="selectChat('ALL', this)" id="chat-ALL">🌍 Общий чат</div>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">Общий чат</div>
    <div id="chat-box"></div>
    <div class="input-area">
      <input id="msg" placeholder="Ваше сообщение..." autofocus>
      <button onclick="send()">Отправить</button>
    </div>
  </div>
</div>

<script>
let ws;
let myNick = "";
let currentChat = "ALL";
const chatBox = document.getElementById("chat-box");
const inp = document.getElementById("msg");

async function auth(endpoint) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  document.getElementById("auth-error").textContent = "";

  if (!username || !password) return document.getElementById("auth-error").textContent = "Заполните все поля!";

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    
    // Успех!
    myNick = username;
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    connectWS();
  } catch (err) {
    document.getElementById("auth-error").textContent = err.message;
  }
}

function login() { auth("/login"); }
function register() { auth("/register"); }

function connectWS() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => ws.send(myNick);

  ws.onmessage = e => {
    const data = e.data;
    if (data.startsWith("SYSTEM_LIST:")) {
      const users = data.replace("SYSTEM_LIST:", "").split(",").filter(u => u !== myNick && u !== "");
      updateUserList(users);
    } else if (data.startsWith("SYSTEM:")) {
      addSystemMessage(data.replace("SYSTEM:", ""));
    } else if (data.startsWith("DELETE_MSG:")) {
      const msgId = data.split(":")[1];
      const el = document.getElementById(`msg-${msgId}`);
      if (el) el.remove();
    } else if (data.startsWith("MSG:")) {
      const parts = data.split(":");
      if (parts.length >= 6) {
        const type = parts[1];
        const from = parts[2];
        const to = parts[3];
        const text = parts.slice(4, parts.length - 1).join(":");
        const id = parts[parts.length - 1];
        
        if (to === "ALL" && currentChat === "ALL") {
          addMessage(from, text, id, from === myNick);
        } else if (to === currentChat || (from === currentChat && to === myNick)) {
          addMessage(from, text, id, from === myNick);
        }
      }
    }
  };
}

function updateUserList(users) {
  const list = document.getElementById("userList");
  Array.from(list.children).forEach(child => { if (child.id !== "chat-ALL") child.remove(); });
  users.forEach(user => {
    const div = document.createElement("div");
    div.className = "user-item";
    div.id = `chat-${user}`;
    div.textContent = `👤 ${user}`;
    div.onclick = function() { selectChat(user, this); };
    list.appendChild(div);
  });
}

function selectChat(target, element) {
  currentChat = target;
  document.getElementById("chatHeader").textContent = target === "ALL" ? "🌍 Общий чат" : `👤 Личный чат с ${target}`;
  document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
  element.classList.add("active");
  chatBox.innerHTML = "";
}

function send() {
  if (!inp.value.trim()) return;
  const id = Date.now().toString();
  ws.send(`${currentChat}|${inp.value}|${id}`);
  inp.value = "";
}

function addMessage(from, text, id, isMe) {
  const div = document.createElement("div");
  div.className = `message ${isMe ? 'my' : 'other'}`;
  div.id = `msg-${id}`;
  
  const textSpan = document.createElement("span");
  textSpan.textContent = `${from}: ${text}`;
  
  const delBtn = document.createElement("span");
  delBtn.className = "delete-btn";
  delBtn.textContent = "🗑️";
  delBtn.onclick = () => { if (confirm("Удалить сообщение?")) ws.send(`DELETE:${id}`); };
  
  div.appendChild(textSpan);
  if (isMe) div.appendChild(delBtn);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function addSystemMessage(text) {
  const div = document.createElement("div");
  div.className = "system-msg";
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
