<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>d чат</title>
  <style>
    :root {
      --primary: #00897b; --bg-base: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
      --text-main: #1f2937; --text-muted: #6b7280; --my-msg: #00897b;
      --other-msg: rgba(255, 255, 255, 0.7); --glass-bg: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.6); --input-bg: rgba(255, 255, 255, 0.6);
      --nav-bg: rgba(255, 255, 255, 0.7); --hover-bg: rgba(255, 255, 255, 0.5);
    }
    body.dark-theme {
      --primary: #26a69a; --bg-base: linear-gradient(135deg, #121212 0%, #1f2937 100%);
      --text-main: #f3f4f6; --text-muted: #9ca3af; --my-msg: #005c4b;
      --other-msg: rgba(255, 255, 255, 0.1); --glass-bg: rgba(20, 20, 20, 0.5);
      --glass-border: rgba(255, 255, 255, 0.1); --input-bg: rgba(0, 0, 0, 0.2);
      --nav-bg: rgba(20, 20, 20, 0.8); --hover-bg: rgba(255, 255, 255, 0.05);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    /* ИСПОЛЬЗУЕМ DVH ДЛЯ МОБИЛЬНЫХ, ЧТОБЫ АДРЕСНАЯ СТРОКА НЕ ЛОМАЛА ВЕРСТКУ */
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; height: 100dvh; background: var(--bg-base); color: var(--text-main); overflow: hidden; transition: background 0.3s; }
    .glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }

    /* ВХОД */
    #auth-screen { margin: auto; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 360px; text-align: center; z-index: 10; }
    .logo-big { font-size: 64px; color: var(--primary); font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .title { font-size: 24px; margin-bottom: 25px; font-weight: 600; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; display: block; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; background: var(--input-bg); color: var(--text-main); outline: none; font-size: 15px; }
    .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; }
    .link { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 15px; display: inline-block; }
    #auth-error { color: #ef4444; margin-top: 15px; font-size: 14px; }

    /* ИНТЕРФЕЙС */
    #app { display: none; width: 100%; height: 100%; position: relative; }
    .main-content { display: flex; width: 100%; height: 100%; padding: 15px; gap: 15px; padding-bottom: 85px; } /* Отступ снизу для навигации */
    
    .sidebar { width: 100%; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 15px; }
    .logo-small { font-size: 32px; color: var(--primary); font-weight: 300; }
    .sidebar-title { font-size: 18px; font-weight: 600; flex: 1; }
    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-item { padding: 12px 15px; cursor: pointer; border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: background 0.2s; margin-bottom: 5px; }
    .user-item:hover { background: var(--hover-bg); }
    .user-item.active { background: var(--primary); color: white; }
    
    .chat-area { display: none; flex: 1; flex-direction: column; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05); background: transparent; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 18px; background: var(--glass-bg); backdrop-filter: blur(16px); z-index: 2; cursor: pointer; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
    #typing-indicator { font-size: 12px; color: var(--text-muted); padding: 5px 20px; display: none; font-style: italic; height: 20px; }

    /* НИЖНЯЯ ПАНЕЛЬ */
    .bottom-nav { 
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); 
      width: 250px; height: 60px; background: var(--nav-bg); backdrop-filter: blur(20px); 
      border-radius: 30px; border: 1px solid var(--glass-border); 
      display: flex; justify-content: space-around; align-items: center; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.1); z-index: 50; 
    }
    .nav-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: color 0.2s; width: 80px; }
    .nav-btn span { font-size: 10px; font-weight: 600; }
    .nav-btn.active { color: var(--primary); }

    /* АВАТАРКИ */
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; text-transform: uppercase; flex-shrink: 0; }
    .avatar-sm { width: 32px; height: 32px; font-size: 14px; }
    .avatar.system { background: var(--input-bg) !important; color: var(--text-main) !important; border: 1px solid var(--glass-border); }

    /* СООБЩЕНИЯ */
    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 85%; }
    .msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    .message { padding: 10px 14px; border-radius: 16px; position: relative; word-break: break-word; font-size: 15px; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .msg-row.my .message { background: var(--my-msg); color: white; border-bottom-right-radius: 4px; }
    .msg-row.other .message { background: var(--other-msg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
    .message img { max-width: 100%; max-height: 300px; border-radius: 12px; cursor: pointer; object-fit: cover; margin-top: 5px; display: block; }
    .message .sticker { font-size: 48px; display: block; text-align: center; }
    
    .msg-actions { display: flex; gap: 5px; opacity: 0; transition: opacity 0.2s; position: absolute; top: -20px; right: 0; background: var(--glass-bg); border-radius: 4px; padding: 2px; }
    .msg-row:hover .msg-actions { opacity: 1; }
    .action-btn { cursor: pointer; font-size: 12px; padding: 2px 6px; border-radius: 4px; background: transparent; border: none; color: var(--text-main); }
    .action-btn:hover { background: var(--hover-bg); }

    /* ВВОД */
    .input-area { display: flex; padding: 15px 20px; border-top: 1px solid var(--glass-border); align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: blur(16px); z-index: 2; }
    .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
    .input-area input[type="text"] { flex: 1; padding: 12px 18px; border: 1px solid transparent; border-radius: 20px; background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; }
    .input-area button.btn-send { background: var(--primary); color: white; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; }

    /* НАСТРОЙКИ */
    #settings-page { display: none; flex: 1; flex-direction: column; border-radius: 24px; overflow-y: auto; padding: 30px; gap: 20px; }
    #settings-page h2 { margin-top: 0; color: var(--primary); }
    .settings-group { background: var(--input-bg); padding: 20px; border-radius: 16px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 15px; }

    /* МОДАЛЬНЫЕ ОКНА */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal { padding: 30px; border-radius: 24px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center; max-height: 90vh; overflow-y: auto; }
    .btn-close { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; color: var(--text-main); font-weight: 600; margin-top: 15px; }

    /* СТИКЕРЫ */
    .sticker-panel { display: none; position: absolute; bottom: 85px; right: 20px; background: var(--glass-bg); backdrop-filter: blur(16px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 15px; grid-template-columns: repeat(4, 1fr); gap: 10px; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    .sticker-panel.show { display: grid; }
    .sticker-btn { background: none; border: none; font-size: 32px; cursor: pointer; padding: 5px; border-radius: 8px; transition: background 0.2s; }
    .sticker-btn:hover { background: var(--input-bg); }

    /* КОНСОЛЬ */
    #dev-console { position: fixed; bottom: 20px; right: 20px; width: 450px; height: 350px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 12px; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; display: none; flex-direction: column; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #dev-console.show { display: flex; }
    .dev-header { padding: 10px 15px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; color: #888; }
    .dev-header span { cursor: pointer; }
    .dev-output { flex: 1; padding: 10px; overflow-y: auto; white-space: pre-wrap; }
    .dev-input-area { display: flex; border-top: 1px solid #333; }
    .dev-input-area span { padding: 10px; color: #888; }
    .dev-input-area input { flex: 1; background: transparent; border: none; color: #00ff00; font-family: inherit; font-size: inherit; outline: none; padding: 10px; }

    /* МОБИЛЬНАЯ ВЕРСИЯ */
    @media (max-width: 768px) {
      .main-content { padding: 0; padding-bottom: 80px; gap: 0; }
      .sidebar { border-radius: 0; border: none; height: 100%; width: 100%; }
      .chat-area { border-radius: 0; border: none; height: 100%; width: 100%; }
      #settings-page { border-radius: 0; border: none; padding: 20px; width: 100%; }
      
      /* Скрываем сайдбар, когда открыт чат */
      body.chat-open .sidebar { display: none; }
      body.chat-open .chat-area { display: flex; }
      body.chat-open .bottom-nav { display: none; } /* Прячем панель, чтобы не мешала переписке */
      
      /* Нижняя панель на мобилке прижимается к низу */
      .bottom-nav { width: 90%; bottom: 10px; height: 65px; }
    }
    body.wallpaper-pattern { background-image: radial-gradient(var(--primary) 1px, transparent 1px); background-size: 20px 20px; }
  </style>
</head>
<body>

<div id="auth-screen" class="glass">
  <div class="logo-big">d</div>
  <div class="title">d чат</div>
  <div class="form-group"><label>Имя пользователя</label><input id="username" placeholder="Логин"></div>
  <div class="form-group"><label>Пароль</label><input id="password" type="password" placeholder="Пароль"></div>
  <div class="form-group"><label>Язык</label><select id="auth-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <div class="form-group"><label>Тема</label><select id="auth-theme"><option value="light">Светлая</option><option value="dark">Тёмная</option></select></div>
  <button class="btn-primary" onclick="login()">Войти</button>
  <div class="link" onclick="register()">Создать аккаунт</div>
  <div id="auth-error"></div>
</div>

<div id="app">
  <div class="main-content">
    <div class="sidebar glass" id="sidebar-view">
      <div class="sidebar-header">
        <div class="logo-small">d</div>
        <div class="sidebar-title" id="sidebar-title-text">Чаты</div>
        <button style="background:none; border:none; font-size:24px; cursor:pointer; color:var(--text-main);" onclick="openCreateGroup()">➕</button>
      </div>
      <div class="user-list" id="userList"></div>
    </div>

    <div class="chat-area glass" id="chat-view">
      <div class="chat-header">
        <button onclick="closeChatMobile()" style="display:none; background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-main); margin-right:10px;" id="back-btn">←</button>
        <div onclick="openProfile()" style="display:flex; align-items:center; gap:15px; cursor:pointer; flex:1;">
          <div class="avatar avatar-sm" id="header-avatar"></div>
          <span id="header-name">Выберите чат</span>
        </div>
      </div>
      <div id="typing-indicator">печатает...</div>
      <div id="chat-box"></div>
      
      <div class="input-area">
        <button class="icon-btn" onclick="toggleStickers()">🐱</button>
        <label class="icon-btn" for="file-input" style="cursor:pointer;">📎</label>
        <input type="file" id="file-input" accept="*/*" style="display: none;" onchange="uploadFile()">
        <input type="text" id="msg" placeholder="Сообщение..." oninput="sendTyping()">
        <button class="btn-send" onclick="send()">➤</button>
      </div>
      <div class="sticker-panel glass" id="stickerPanel">
        <button class="sticker-btn" onclick="sendSticker('😺')">😺</button>
        <button class="sticker-btn" onclick="sendSticker('😸')">😸</button>
        <button class="sticker-btn" onclick="sendSticker('😻')">😻</button>
        <button class="sticker-btn" onclick="sendSticker('😽')">😽</button>
        <button class="sticker-btn" onclick="sendSticker('❤️')">❤️</button>
        <button class="sticker-btn" onclick="sendSticker('💔')">💔</button>
        <button class="sticker-btn" onclick="sendSticker('👍')">👍</button>
        <button class="sticker-btn" onclick="sendSticker('😿')">😿</button>
        <button class="sticker-btn" onclick="sendSticker('🐾')">🐾</button>
        <button class="sticker-btn" onclick="sendSticker('🥰')">🥰</button>
        <button class="sticker-btn" onclick="sendSticker('😂')">😂</button>
        <button class="sticker-btn" onclick="sendSticker('🔥')">🔥</button>
      </div>
    </div>

    <div id="settings-page" class="glass">
      <h2>Настройки</h2>
      <div class="settings-group">
        <label>Описание профиля</label>
        <input id="settings-desc" placeholder="О себе..." style="padding:10px; border-radius:8px; border:1px solid var(--glass-border); background:var(--input-bg); color:var(--text-main);">
        <button class="btn-close" onclick="saveDescription()">Сохранить описание</button>
      </div>
      <div class="settings-group">
        <label>Язык</label>
        <select id="settings-lang" onchange="changeLang(this.value)"><option value="ru">Русский</option><option value="en">English</option></select>
        <label>Тема</label>
        <select id="settings-theme" onchange="changeTheme(this.value)"><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
        <label>Обои</label>
        <select id="settings-wallpaper" onchange="changeWallpaper(this.value)"><option value="solid">Однотонные</option><option value="pattern">Узор</option></select>
        <button class="btn-close" style="background:#ef4444; color:white; border:none;" onclick="logout()">Выйти из аккаунта</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-chats" onclick="switchTab('chats')">💬 <span>Чаты</span></button>
    <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">⚙️ <span>Настройки</span></button>
  </div>
</div>

<div class="modal-overlay" id="profileModal">
  <div class="modal glass">
    <div class="avatar" id="profile-avatar" style="width: 80px; height: 80px; font-size: 32px; margin: 0 auto 15px auto;"></div>
    <h2 id="profile-name" style="margin: 0 0 10px 0;">Имя</h2>
    <p id="profile-desc" style="color: var(--text-muted);">Описание...</p>
    <button class="btn-close" onclick="closeProfile()">Закрыть</button>
  </div>
</div>

<div class="modal-overlay" id="groupModal">
  <div class="modal glass">
    <h2>Создать группу</h2>
    <input id="group-name" placeholder="Название группы" style="width:100%; padding:10px; margin-bottom:15px; border-radius:8px; border:1px solid var(--glass-border); background:var(--input-bg); color:var(--text-main);">
    <button class="btn-primary" onclick="createGroup()">Создать</button>
    <button class="btn-close" onclick="document.getElementById('groupModal').classList.remove('show')">Отмена</button>
  </div>
</div>

<div id="dev-console">
  <div class="dev-header"><span>d чат Admin Console</span><span onclick="toggleConsole()">✕</span></div>
  <div class="dev-output" id="dev-output">Введите пароль для доступа...\n</div>
  <div class="dev-input-area"><span>></span><input type="text" id="dev-input" onkeydown="handleDevCommand(event)" placeholder="Введите команду..."></div>
</div>

<script>
let ws;
let myNick = "";
let currentChat = null;
let currentLang = 'ru';
let currentTheme = 'light';
let currentWallpaper = 'solid';
let allMessages = {};
let groups = [];
let typingTimer;
let adminPassword = null;

const chatBox = document.getElementById("chat-box");
const inp = document.getElementById("msg");
const typingInd = document.getElementById("typing-indicator");
const backBtn = document.getElementById("back-btn");

const translations = {
  ru: { chats: "Чаты", settings: "Настройки", msg: "Сообщение..." },
  en: { chats: "Chats", settings: "Settings", msg: "Message..." }
};

function switchTab(tab) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`nav-${tab}`).classList.add('active');
  if (tab === 'chats') {
    document.getElementById('settings-page').style.display = 'none';
    document.getElementById('sidebar-view').style.display = 'flex';
    if (currentChat) document.getElementById('chat-view').style.display = 'flex';
  } else {
    document.getElementById('sidebar-view').style.display = 'none';
    document.getElementById('chat-view').style.display = 'none';
    document.getElementById('settings-page').style.display = 'flex';
  }
}

function openChat(target, isGroup = false) {
  currentChat = target;
  const name = isGroup ? (groups.find(g => g.id === target)?.name || "Группа") : target;
  document.getElementById('header-name').textContent = name;
  
  const headerAvatar = document.getElementById("header-avatar");
  if (isGroup) {
    headerAvatar.textContent = "👥";
    headerAvatar.style.backgroundColor = "var(--primary)";
  } else {
    headerAvatar.textContent = target === "notifications" ? "🔔" : target.charAt(0);
    headerAvatar.style.backgroundColor = target === "notifications" ? "var(--input-bg)" : getAvatarColor(target);
  }
  
  chatBox.innerHTML = "";
  if (allMessages[target]) allMessages[target].forEach(m => addMessage(m.from, m.text, m.id, m.isMe, m.isEdited));
  
  if (window.innerWidth <= 768) {
    document.body.classList.add('chat-open');
    backBtn.style.display = 'block'; // Показываем кнопку "Назад" на мобилках
  } else { 
    document.getElementById('chat-view').style.display = 'flex'; 
    document.getElementById('sidebar-view').style.width = '350px'; 
  }
}

function closeChatMobile() {
  document.body.classList.remove('chat-open');
  backBtn.style.display = 'none';
  document.getElementById('chat-view').style.display = 'none';
}

function openProfile() {
  if (!currentChat || currentChat === 'notifications' || currentChat.startsWith("group_")) return;
  fetch(`/get_profile/${currentChat}`).then(r => r.json()).then(data => {
    document.getElementById('profile-name').textContent = currentChat;
    document.getElementById('profile-desc').textContent = data.description;
    const avatar = document.getElementById('profile-avatar');
    avatar.textContent = currentChat.charAt(0);
    avatar.style.backgroundColor = getAvatarColor(currentChat);
    document.getElementById('profileModal').classList.add('show');
  });
}
function closeProfile() { document.getElementById('profileModal').classList.remove('show'); }
async function saveDescription() {
  const desc = document.getElementById('settings-desc').value;
  await fetch("/update_profile", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: myNick, description: desc }) });
  alert("Описание сохранено!");
}

function openCreateGroup() { document.getElementById('groupModal').classList.add('show'); }
async function createGroup() {
  const name = document.getElementById('group-name').value.trim();
  if (!name) return alert("Введите название");
  const res = await fetch("/create_group", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: name, creator: myNick }) });
  const data = await res.json();
  groups.push({ id: data.id, name: data.name });
  document.getElementById('groupModal').classList.remove('show');
  document.getElementById('group-name').value = "";
  updateUserList();
}

function applyLanguage(lang) {
  currentLang = lang;
  document.getElementById("sidebar-title-text").textContent = translations[lang].chats;
  inp.placeholder = translations[lang].msg;
}
function applyTheme(theme) { currentTheme = theme; document.body.classList.toggle('dark-theme', theme === 'dark'); }
function applyWallpaper(wall) { currentWallpaper = wall; document.body.classList.toggle('wallpaper-pattern', wall === 'pattern'); }
document.getElementById("auth-theme").addEventListener("change", (e) => applyTheme(e.target.value));

async function auth(endpoint) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const lang = document.getElementById("auth-lang").value;
  const theme = document.getElementById("auth-theme").value;
  document.getElementById("auth-error").textContent = "";
  if (!username || !password) return document.getElementById("auth-error").textContent = "Заполните все поля!";
  try {
    const res = await fetch(endpoint, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, password }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    localStorage.setItem("dm_user", username); localStorage.setItem("dm_lang", lang); localStorage.setItem("dm_theme", theme);
    startSession(username, lang, theme);
  } catch (err) { document.getElementById("auth-error").textContent = err.message; }
}
function login() { auth("/login"); }
function register() { auth("/register"); }

function startSession(username, lang, theme) {
  myNick = username; applyLanguage(lang); applyTheme(theme);
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  fetch(`/get_groups/${myNick}`).then(r => r.json()).then(data => { groups = data; connectWS(); });
}
function logout() { localStorage.clear(); location.reload(); }

window.onload = () => {
  const savedUser = localStorage.getItem("dm_user");
  const savedLang = localStorage.getItem("dm_lang") || 'ru';
  const savedTheme = localStorage.getItem("dm_theme") || 'light';
  document.getElementById("auth-theme").value = savedTheme;
  applyTheme(savedTheme);
  if (savedUser) startSession(savedUser, savedLang, savedTheme);
};

function connectWS() {
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(`${wsProtocol}${location.host}/ws`);
  ws.onopen = () => ws.send(myNick);
  
  ws.onmessage = e => {
    const data = e.data;
    if (data.startsWith("SYSTEM_LIST:")) {
      const users = data.replace("SYSTEM_LIST:", "").split(",").filter(u => u !== myNick && u !== "");
      updateUserList(users);
    } else if (data.startsWith("TYPING:")) {
      const from = data.split(":")[1];
      if (currentChat === from) {
        typingInd.style.display = "block";
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => typingInd.style.display = "none", 2000);
      }
    } else if (data.startsWith("EDIT_MSG:")) {
      const parts = data.split(":");
      const msgId = parts[1];
      const newText = parts.slice(2).join(":");
      const el = document.querySelector(`#msg-${msgId} .text-content`);
      if (el) el.textContent = newText;
    } else if (data.startsWith("DELETE_MSG:")) {
      const msgId = data.split(":")[1];
      document.getElementById(`msg-${msgId}`)?.remove();
    } else if (data.startsWith("MSG:")) {
      const parts = data.split(":");
      if (parts.length >= 6) {
        const from = parts[1]; const to = parts[2]; const text = parts.slice(3, parts.length - 2).join(":");
        const id = parts[parts.length - 2]; const isGroupMsg = parts[parts.length - 1] === "True";
        
        if (from === myNick) return;
        const chatPartner = isGroupMsg ? to : from;
        
        if (!allMessages[chatPartner]) allMessages[chatPartner] = [];
        allMessages[chatPartner].push({ id, from, text, isMe: false });
        
        if (currentChat === chatPartner) addMessage(from, text, id, false);
      }
    }
  };
}

function updateUserList(usersList = null) {
  const list = document.getElementById("userList");
  list.innerHTML = "";
  
  const sysDiv = document.createElement("div");
  sysDiv.className = "user-item";
  sysDiv.innerHTML = `<div class="avatar avatar-sm system">🔔</div><span>notifications</span>`;
  sysDiv.onclick = () => openChat("notifications");
  list.appendChild(sysDiv);

  groups.forEach(grp => {
    const div = document.createElement("div");
    div.className = "user-item";
    div.innerHTML = `<div class="avatar avatar-sm" style="background:var(--primary);">👥</div><span>${grp.name}</span>`;
    div.onclick = () => openChat(grp.id, true);
    list.appendChild(div);
  });

  if (usersList) {
    usersList.forEach(user => {
      const div = document.createElement("div");
      div.className = "user-item";
      div.appendChild(createAvatar(user, "avatar-sm"));
      div.innerHTML += `<span>${user}</span>`;
      div.onclick = () => openChat(user);
      list.appendChild(div);
    });
  }
}

function sendTyping() {
  if (!currentChat || currentChat === "notifications") return;
  ws.send(`TYPING:${currentChat}`);
}

function send() {
  if (!currentChat || !inp.value.trim() || currentChat === "notifications") return;
  const id = Date.now().toString();
  ws.send(`${currentChat}|${inp.value}|${id}`);
  addMessage(myNick, inp.value, id, true);
  if (!allMessages[currentChat]) allMessages[currentChat] = [];
  allMessages[currentChat].push({ id, from: myNick, text: inp.value, isMe: true });
  inp.value = "";
}

function sendSticker(sticker) {
  if (!currentChat || currentChat === "notifications") return;
  const id = Date.now().toString();
  ws.send(`${currentChat}|STICKER:${sticker}|${id}`);
  addMessage(myNick, `STICKER:${sticker}`, id, true);
  if (!allMessages[currentChat]) allMessages[currentChat] = [];
  allMessages[currentChat].push({ id, from: myNick, text: `STICKER:${sticker}`, isMe: true });
  toggleStickers();
}

function toggleStickers() { document.getElementById("stickerPanel").classList.toggle("show"); }

async function uploadFile() {
  if (!currentChat || currentChat === "notifications") return;
  const file = document.getElementById("file-input").files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append("file", file);
  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    const data = await res.json();
    const id = Date.now().toString();
    const msgText = `FILE:${data.url}`;
    ws.send(`${currentChat}|${msgText}|${id}`);
    addMessage(myNick, msgText, id, true);
    if (!allMessages[currentChat]) allMessages[currentChat] = [];
    allMessages[currentChat].push({ id, from: myNick, text: msgText, isMe: true });
  } catch (err) { alert("Ошибка: " + err.message); }
  finally { document.getElementById("file-input").value = ""; }
}

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const colors = ['#00897b', '#1e88e5', '#8e24aa', '#d81b60', '#e53935', '#fb8c00', '#43a047', '#546e7a'];
  return colors[Math.abs(hash) % colors.length];
}

function createAvatar(name, sizeClass = "") {
  const div = document.createElement("div");
  div.className = `avatar ${sizeClass}`;
  if (name === "notifications") { div.classList.add("system"); div.textContent = "🔔"; }
  else { div.textContent = name.charAt(0); div.style.backgroundColor = getAvatarColor(name); }
  return div;
}

function addMessage(from, text, id, isMe) {
  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? 'my' : 'other'}`;
  row.id = `msg-${id}`;
  if (!isMe) row.appendChild(createAvatar(from, "avatar-sm"));
  const bubble = document.createElement("div");
  bubble.className = "message";
  
  if (text.startsWith("STICKER:")) {
    const sticker = document.createElement("span");
    sticker.className = "sticker";
    sticker.textContent = text.replace("STICKER:", "");
    bubble.appendChild(sticker);
  } else if (text.startsWith("FILE:")) {
    const img = document.createElement("img");
    img.src = text.replace("FILE:", "");
    img.onclick = () => window.open(img.src, "_blank");
    bubble.appendChild(img);
  } else {
    const textSpan = document.createElement("span");
    textSpan.className = "text-content";
    textSpan.textContent = text;
    bubble.appendChild(textSpan);
    
    if (isMe) {
      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const editBtn = document.createElement("button");
      editBtn.className = "action-btn";
      editBtn.textContent = "✏️";
      editBtn.onclick = () => {
        const newText = prompt("Редактировать сообщение:", text);
        if (newText !== null && newText.trim() !== "") ws.send(`EDIT:${id}:${newText}`);
      };
      const delBtn = document.createElement("button");
      delBtn.className = "action-btn";
      delBtn.textContent = "🗑️";
      delBtn.onclick = () => { if (confirm("Удалить?")) ws.send(`DELETE:${id}`); };
      actions.appendChild(editBtn);
      actions.appendChild(delBtn);
      bubble.appendChild(actions);
    }
  }
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function toggleConsole() {
  const consoleEl = document.getElementById("dev-console");
  consoleEl.classList.toggle("show");
  if (consoleEl.classList.contains("show")) document.getElementById("dev-input").focus();
}
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") { e.preventDefault(); toggleConsole(); }
});

async function handleDevCommand(event) {
  if (event.key !== "Enter") return;
  const input = document.getElementById("dev-input");
  const output = document.getElementById("dev-output");
  const cmd = input.value.trim();
  input.value = "";
  if (!cmd) return;
  
  if (adminPassword === null) {
    adminPassword = cmd;
    output.innerHTML += `Попытка входа с паролем...\n`;
    return;
  }
  
  output.innerHTML += `> ${cmd}\n`;
  try {
    const res = await fetch("/admin/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: adminPassword, command: cmd })
    });
    const data = await res.json();
    if (!res.ok) {
      if (data.detail === "Неверный пароль администратора") { adminPassword = null; output.innerHTML += `ОШИБКА: Неверный пароль.\n`; }
      else output.innerHTML += `ОШИБКА: ${data.detail}\n`;
    } else {
      output.innerHTML += `${data.result}\n`;
    }
  } catch (err) { output.innerHTML += `ОШИБКА СЕТИ: ${err.message}\n`; }
  output.scrollTop = output.scrollHeight;
}

inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
