<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DMassanger</title>
  <style>
    :root {
      --primary: #00897b; --bg-base: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
      --text-main: #1f2937; --text-muted: #6b7280; --my-msg: #00897b;
      --other-msg: rgba(255, 255, 255, 0.7); --glass-bg: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.6); --input-bg: rgba(255, 255, 255, 0.6);
      --hover-bg: rgba(255, 255, 255, 0.5);
    }
    body.dark-theme {
      --primary: #26a69a; --bg-base: linear-gradient(135deg, #121212 0%, #1f2937 100%);
      --text-main: #f3f4f6; --text-muted: #9ca3af; --my-msg: #005c4b;
      --other-msg: rgba(255, 255, 255, 0.1); --glass-bg: rgba(20, 20, 20, 0.5);
      --glass-border: rgba(255, 255, 255, 0.1); --input-bg: rgba(0, 0, 0, 0.2);
      --hover-bg: rgba(255, 255, 255, 0.05);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: var(--bg-base); color: var(--text-main); overflow: hidden; transition: background 0.3s; }
    .glass { background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--glass-border); }

    #auth-screen { margin: auto; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 360px; text-align: center; z-index: 10; }
    .logo-big { font-size: 64px; color: var(--primary); font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .title { font-size: 24px; margin-bottom: 25px; font-weight: 600; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; display: block; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; background: var(--input-bg); color: var(--text-main); outline: none; font-size: 15px; transition: border 0.2s; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
    .btn-primary { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: 600; margin-top: 10px; transition: transform 0.2s, opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
    .link { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 15px; display: inline-block; }
    #auth-error { color: #ef4444; margin-top: 15px; font-size: 14px; }

    #app { display: none; width: 100%; height: 100%; padding: 15px; gap: 15px; }
    .sidebar { width: 320px; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05); }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 15px; }
    .logo-small { font-size: 32px; color: var(--primary); font-weight: 300; }
    .sidebar-title { font-size: 18px; font-weight: 600; flex: 1; }
    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-item { padding: 12px 15px; cursor: pointer; border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: background 0.2s; margin-bottom: 5px; }
    .user-item:hover { background: var(--hover-bg); }
    .user-item.active { background: var(--primary); color: white; }
    .user-item.active .avatar { background: rgba(255,255,255,0.2) !important; }
    .sidebar-footer { padding: 15px; border-top: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 10px; }
    .btn-settings, .btn-logout { width: 100%; padding: 12px; border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; background: var(--input-bg); color: var(--text-main); }
    .btn-settings:hover { background: var(--hover-bg); }
    .btn-logout { color: #ef4444; border-color: #ef4444; background: transparent; }
    .btn-logout:hover { background: rgba(239, 68, 68, 0.1); }

    .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; text-transform: uppercase; flex-shrink: 0; }
    .avatar-sm { width: 32px; height: 32px; font-size: 14px; }
    .avatar.system { background: var(--input-bg) !important; color: var(--text-main) !important; border: 1px solid var(--glass-border); }

    .chat-area { flex: 1; display: flex; flex-direction: column; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05); background: transparent; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 18px; background: var(--glass-bg); backdrop-filter: blur(16px); z-index: 2; }
    .chat-header .avatar { display: none; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 75%; }
    .msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    .message { padding: 10px 14px; border-radius: 16px; position: relative; word-break: break-word; font-size: 15px; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05); animation: slideIn 0.2s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .msg-row.my .message { background: var(--my-msg); color: white; border-bottom-right-radius: 4px; border: 1px solid rgba(255,255,255,0.1); }
    .msg-row.other .message { background: var(--other-msg); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--glass-border); }
    .message img { max-width: 100%; max-height: 300px; border-radius: 12px; cursor: pointer; object-fit: cover; margin-top: 5px; display: block; }
    .delete-btn { cursor: pointer; opacity: 0; font-size: 12px; position: absolute; bottom: 5px; right: 5px; transition: opacity 0.2s; padding: 4px; }
    .msg-row:hover .delete-btn { opacity: 0.7; }
    .msg-row.my .delete-btn { color: white; }
    .delete-btn:hover { opacity: 1; }

    .input-area { display: flex; padding: 15px 20px; border-top: 1px solid var(--glass-border); align-items: center; gap: 10px; background: var(--glass-bg); backdrop-filter: blur(16px); z-index: 2; }
    .icon-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); transition: color 0.2s; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; }
    .icon-btn:hover { color: var(--primary); background: var(--input-bg); }
    .input-area input[type="text"] { flex: 1; padding: 12px 18px; border: 1px solid transparent; border-radius: 20px; background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; transition: border 0.2s; }
    .input-area input[type="text"]:focus { border-color: var(--glass-border); }
    .input-area button.btn-send { background: var(--primary); color: white; border: none; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s, box-shadow 0.2s; }
    .input-area button.btn-send:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(0,137,123,0.3); }

    .emoji-panel { position: absolute; bottom: 85px; right: 20px; border-radius: 16px; padding: 15px; display: none; grid-template-columns: repeat(6, 1fr); gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 5; }
    .emoji-panel.show { display: grid; }
    .emoji-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; border-radius: 8px; transition: background 0.2s; }
    .emoji-btn:hover { background: var(--input-bg); }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal { padding: 30px; border-radius: 24px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .modal h3 { margin-top: 0; color: var(--text-main); margin-bottom: 20px; text-align: center; }
    .modal .form-group { margin-bottom: 20px; }
    .btn-close { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; color: var(--text-main); font-weight: 600; transition: background 0.2s; }
    .btn-close:hover { background: var(--hover-bg); }

    #dev-console { position: fixed; bottom: 20px; right: 20px; width: 450px; height: 350px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); border: 1px solid #333; border-radius: 12px; color: #00ff00; font-family: 'Courier New', monospace; font-size: 13px; display: none; flex-direction: column; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    #dev-console.show { display: flex; }
    .dev-header { padding: 10px 15px; background: #111; border-bottom: 1px solid #333; display: flex; justify-content: space-between; color: #888; }
    .dev-header span { cursor: pointer; }
    .dev-output { flex: 1; padding: 10px; overflow-y: auto; white-space: pre-wrap; }
    .dev-input-area { display: flex; border-top: 1px solid #333; }
    .dev-input-area span { padding: 10px; color: #888; }
    .dev-input-area input { flex: 1; background: transparent; border: none; color: #00ff00; font-family: inherit; font-size: inherit; outline: none; padding: 10px; }
  </style>
</head>
<body>

<div id="auth-screen" class="glass">
  <div class="logo-big">d</div>
  <div class="title">DMassanger</div>
  <div class="form-group"><label>Имя пользователя</label><input id="username" placeholder="Введите логин"></div>
  <div class="form-group"><label>Пароль</label><input id="password" type="password" placeholder="Введите пароль"></div>
  <div class="form-group"><label>Язык / Language</label><select id="auth-lang"><option value="ru">Русский</option><option value="en">English</option></select></div>
  <div class="form-group"><label>Тема / Theme</label><select id="auth-theme"><option value="light">Светлая / Light</option><option value="dark">Тёмная / Dark</option></select></div>
  <button class="btn-primary" onclick="login()">Войти</button>
  <div class="link" onclick="register()">Создать аккаунт</div>
  <div id="auth-error"></div>
</div>

<div id="app">
  <div class="sidebar glass">
    <div class="sidebar-header"><div class="logo-small">d</div><div class="sidebar-title" id="sidebar-title-text">Чаты</div></div>
    <div class="user-list" id="userList"></div>
    <div class="sidebar-footer">
      <button class="btn-settings" onclick="openSettings()">⚙️ <span id="settings-text">Настройки</span></button>
      <button class="btn-logout" onclick="logout()">🚪 <span id="logout-text">Выйти</span></button>
    </div>
  </div>
  <div class="chat-area glass">
    <div class="chat-header"><div class="avatar" id="header-avatar"></div><span id="header-name">Выберите чат</span></div>
    <div id="chat-box"></div>
    <div class="emoji-panel glass" id="emojiPanel">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button><button class="emoji-btn" onclick="addEmoji('😂')">😂</button><button class="emoji-btn" onclick="addEmoji('👍')">👍</button><button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button><button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button><button class="emoji-btn" onclick="addEmoji('🎉')">🎉</button><button class="emoji-btn" onclick="addEmoji('🐱')">🐱</button><button class="emoji-btn" onclick="addEmoji('💩')">💩</button><button class="emoji-btn" onclick="addEmoji('😎')">😎</button><button class="emoji-btn" onclick="addEmoji('💯')">💯</button><button class="emoji-btn" onclick="addEmoji('🤔')">🤔</button><button class="emoji-btn" onclick="addEmoji('😢')">😢</button>
    </div>
    <div class="input-area">
      <button class="icon-btn" onclick="toggleEmoji()">😊</button>
      <label class="icon-btn" for="file-input" style="cursor:pointer;">📎</label>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadFile()">
      <input type="text" id="msg" placeholder="Сообщение..." autofocus>
      <button class="btn-send" onclick="send()">➤</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="settingsModal">
  <div class="modal glass">
    <h3>Настройки</h3>
    <div class="form-group"><label>Язык / Language</label><select id="settings-lang" onchange="changeLang(this.value)"><option value="ru">Русский</option><option value="en">English</option></select></div>
    <div class="form-group"><label>Тема / Theme</label><select id="settings-theme" onchange="changeTheme(this.value)"><option value="light">Светлая / Light</option><option value="dark">Тёмная / Dark</option></select></div>
    <div class="form-group"><label>Обои / Wallpaper</label><select id="settings-wallpaper" onchange="changeWallpaper(this.value)"><option value="solid">Однотонные / Solid</option><option value="pattern">Узор / Pattern</option></select></div>
    <button class="btn-close" onclick="closeSettings()">Закрыть</button>
  </div>
</div>

<div id="dev-console">
  <div class="dev-header"><span>DMassanger Admin Console</span><span onclick="toggleConsole()">✕</span></div>
  <div class="dev-output" id="dev-output">Введите пароль для доступа...\n</div>
  <div class="dev-input-area"><span>></span><input type="text" id="dev-input" onkeydown="handleDevCommand(event)" placeholder="Введите команду..."></div>
</div>

<script>
let ws;
let myNick = "";
let currentChat = null;
let currentLang = 'ru';
let currentTheme = 'light';
let currentWallpaper = 'solid';
let adminPassword = null;
let allMessages = {};

const chatBox = document.getElementById("chat-box");
const inp = document.getElementById("msg");

const translations = {
  ru: { chats: "Чаты", choose: "Выберите чат", settings: "Настройки", logout: "Выйти", close: "Закрыть", msg: "Сообщение..." },
  en: { chats: "Chats", choose: "Select a chat", settings: "Settings", logout: "Log out", close: "Close", msg: "Message..." }
};

function applyLanguage(lang) {
  currentLang = lang;
  document.getElementById("sidebar-title-text").textContent = translations[lang].chats;
  document.getElementById("settings-text").textContent = translations[lang].settings;
  document.getElementById("logout-text").textContent = translations[lang].logout;
  if(!currentChat) document.getElementById("header-name").textContent = translations[lang].choose;
  document.querySelector(".btn-close").textContent = translations[lang].close;
  inp.placeholder = translations[lang].msg;
}

function applyTheme(theme) {
  currentTheme = theme;
  document.body.classList.toggle('dark-theme', theme === 'dark');
}

function applyWallpaper(wall) {
  currentWallpaper = wall;
  document.body.classList.toggle('wallpaper-pattern', wall === 'pattern');
}

document.getElementById("auth-theme").addEventListener("change", (e) => applyTheme(e.target.value));

async function auth(endpoint) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const lang = document.getElementById("auth-lang").value;
  const theme = document.getElementById("auth-theme").value;
  document.getElementById("auth-error").textContent = "";
  if (!username || !password) return document.getElementById("auth-error").textContent = "Заполните все поля!";

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    
    localStorage.setItem("dm_user", username);
    localStorage.setItem("dm_lang", lang);
    localStorage.setItem("dm_theme", theme);
    startSession(username, lang, theme);
  } catch (err) {
    document.getElementById("auth-error").textContent = err.message;
  }
}

function login() { auth("/login"); }
function register() { auth("/register"); }

function startSession(username, lang, theme) {
  myNick = username;
  applyLanguage(lang);
  applyTheme(theme);
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
  connectWS();
}

function logout() {
  localStorage.removeItem("dm_user");
  localStorage.removeItem("dm_lang");
  localStorage.removeItem("dm_theme");
  location.reload();
}

window.onload = () => {
  const savedUser = localStorage.getItem("dm_user");
  const savedLang = localStorage.getItem("dm_lang") || 'ru';
  const savedTheme = localStorage.getItem("dm_theme") || 'light';
  document.getElementById("auth-theme").value = savedTheme;
  applyTheme(savedTheme);
  if (savedUser) startSession(savedUser, savedLang, savedTheme);
};

function connectWS() {
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(`${wsProtocol}${location.host}/ws`);
  ws.onopen = () => ws.send(myNick);
  
  ws.onmessage = e => {
    const data = e.data;
    if (data.startsWith("SYSTEM_LIST:")) {
      const users = data.replace("SYSTEM_LIST:", "").split(",").filter(u => u !== myNick && u !== "");
      updateUserList(users);
    } else if (data.startsWith("DELETE_MSG:")) {
      const msgId = data.split(":")[1];
      document.getElementById(`msg-${msgId}`)?.remove();
      for (let user in allMessages) {
        allMessages[user] = allMessages[user].filter(m => m.id !== msgId);
      }
    } else if (data.startsWith("MSG:")) {
      const parts = data.split(":");
      if (parts.length >= 6) {
        const to = parts[3];
        const text = parts.slice(4, parts.length - 1).join(":");
        const id = parts[parts.length - 1];
        const from = parts[2];
        
        if (from === myNick) return;

        let chatPartner = from;
        if (from === "notifications") chatPartner = "notifications";
        
        if (!allMessages[chatPartner]) allMessages[chatPartner] = [];
        allMessages[chatPartner].push({ id, from, text, isMe: false });

        if (currentChat === chatPartner) {
          addMessage(from, text, id, false);
        }
      }
    }
  };
}

function updateUserList(users) {
  const list = document.getElementById("userList");
  list.innerHTML = "";
  
  const sysDiv = document.createElement("div");
  sysDiv.className = "user-item";
  sysDiv.id = "chat-notifications";
  const sysAvatar = document.createElement("div");
  sysAvatar.className = "avatar avatar-sm system";
  sysAvatar.innerHTML = "🔔";
  const sysName = document.createElement("span");
  sysName.textContent = "notifications";
  sysDiv.appendChild(sysAvatar);
  sysDiv.appendChild(sysName);
  sysDiv.onclick = function() { selectChat("notifications", this); };
  list.appendChild(sysDiv);

  users.forEach(user => {
    const div = document.createElement("div");
    div.className = "user-item";
    div.id = `chat-${user}`;
    div.appendChild(createAvatar(user, "avatar-sm"));
    const nameSpan = document.createElement("span");
    nameSpan.textContent = user;
    div.appendChild(nameSpan);
    div.onclick = function() { selectChat(user, this); };
    list.appendChild(div);
  });
}

function selectChat(target, element) {
  currentChat = target;
  const headerAvatar = document.getElementById("header-avatar");
  headerAvatar.style.display = "flex";
  
  if (target === "notifications") {
    headerAvatar.textContent = "🔔";
    headerAvatar.style.backgroundColor = "var(--input-bg)";
    headerAvatar.style.color = "var(--text-main)";
    document.getElementById("header-name").textContent = "Уведомления";
  } else {
    headerAvatar.textContent = target.charAt(0);
    headerAvatar.style.backgroundColor = getAvatarColor(target);
    headerAvatar.style.color = "white";
    document.getElementById("header-name").textContent = target;
  }
  
  document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
  element.classList.add("active");
  
  chatBox.innerHTML = "";
  if (allMessages[target]) {
    allMessages[target].forEach(m => addMessage(m.from, m.text, m.id, m.isMe));
  }
}

function send() {
  if (!currentChat) return alert("Выберите собеседника!");
  if (!inp.value.trim() || currentChat === "notifications") return;
  
  const id = Date.now().toString();
  ws.send(`${currentChat}|${inp.value}|${id}`);
  addMessage(myNick, inp.value, id, true);
  
  if (!allMessages[currentChat]) allMessages[currentChat] = [];
  allMessages[currentChat].push({ id, from: myNick, text: inp.value, isMe: true });
  
  inp.value = "";
}

async function uploadFile() {
  if (!currentChat || currentChat === "notifications") {
    alert("Выберите собеседника!");
    document.getElementById("file-input").value = "";
    return;
  }
  const file = document.getElementById("file-input").files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    if (!res.ok) throw new Error("Ошибка загрузки");
    const data = await res.json();
    const id = Date.now().toString();
    const msgText = `IMG:${data.url}`;
    ws.send(`${currentChat}|${msgText}|${id}`);
    addMessage(myNick, msgText, id, true);
    
    if (!allMessages[currentChat]) allMessages[currentChat] = [];
    allMessages[currentChat].push({ id, from: myNick, text: msgText, isMe: true });
  } catch (err) {
    alert("Ошибка: " + err.message);
  } finally {
    document.getElementById("file-input").value = ""; 
  }
}

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const colors = ['#00897b', '#1e88e5', '#8e24aa', '#d81b60', '#e53935', '#fb8c00', '#43a047', '#546e7a'];
  return colors[Math.abs(hash) % colors.length];
}

function createAvatar(name, sizeClass = "") {
  const div = document.createElement("div");
  div.className = `avatar ${sizeClass}`;
  if (name === "notifications") {
    div.classList.add("system");
    div.textContent = "🔔";
  } else {
    div.textContent = name.charAt(0);
    div.style.backgroundColor = getAvatarColor(name);
  }
  return div;
}

function addMessage(from, text, id, isMe) {
  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? 'my' : 'other'}`;
  row.id = `msg-${id}`;
  if (!isMe) row.appendChild(createAvatar(from, "avatar-sm"));

  const bubble = document.createElement("div");
  bubble.className = "message";
  
  if (text.startsWith("IMG:")) {
    const imgUrl = text.replace("IMG:", "");
    const img = document.createElement("img");
    img.src = imgUrl;
    img.onclick = () => window.open(imgUrl, "_blank");
    bubble.appendChild(img);
  } else {
    bubble.textContent = text;
  }
  
  if (isMe) {
    const delBtn = document.createElement("span");
    delBtn.className = "delete-btn";
    delBtn.textContent = "🗑️";
    delBtn.onclick = () => { if (confirm("Удалить сообщение?")) ws.send(`DELETE:${id}`); };
    bubble.appendChild(delBtn);
  }
  
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function toggleEmoji() { document.getElementById("emojiPanel").classList.toggle("show"); }
function addEmoji(emoji) { inp.value += emoji; inp.focus(); document.getElementById("emojiPanel").classList.remove("show"); }

function openSettings() {
  document.getElementById("settings-lang").value = currentLang;
  document.getElementById("settings-theme").value = currentTheme;
  document.getElementById("settings-wallpaper").value = currentWallpaper;
  document.getElementById("settingsModal").classList.add("show");
}
function closeSettings() { document.getElementById("settingsModal").classList.remove("show"); }
function changeLang(val) { applyLanguage(val); localStorage.setItem("dm_lang", val); }
function changeTheme(val) { applyTheme(val); localStorage.setItem("dm_theme", val); }
function changeWallpaper(val) { applyWallpaper(val); }

// --- СКРЫТАЯ КОНСОЛЬ РАЗРАБОТЧИКА ---
function toggleConsole() {
  const consoleEl = document.getElementById("dev-console");
  consoleEl.classList.toggle("show");
  if (consoleEl.classList.contains("show")) {
    document.getElementById("dev-input").focus();
  }
}

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey && e.shiftKey && e.code === "KeyD") {
    e.preventDefault();
    toggleConsole();
  }
});

async function handleDevCommand(event) {
  if (event.key !== "Enter") return;
  
  const input = document.getElementById("dev-input");
  const output = document.getElementById("dev-output");
  const cmd = input.value.trim();
  input.value = "";
  
  if (!cmd) return;
  
  if (adminPassword === null) {
    adminPassword = cmd;
    output.innerHTML += `Попытка входа с паролем...\n`;
    input.value = "";
    return;
  }
  
  output.innerHTML += `> ${cmd}\n`;
  
  try {
    const res = await fetch("/admin/command", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: adminPassword, command: cmd })
    });
    const data = await res.json();
    
    if (!res.ok) {
      if (data.detail === "Неверный пароль администратора") {
        adminPassword = null;
        output.innerHTML += `ОШИБКА: Неверный пароль. Введите пароль заново.\n`;
      } else {
        output.innerHTML += `ОШИБКА: ${data.detail}\n`;
      }
    } else {
      output.innerHTML += `${data.result}\n`;
    }
  } catch (err) {
    output.innerHTML += `ОШИБКА СЕТИ: ${err.message}\n`;
  }
  
  output.scrollTop = output.scrollHeight;
}

inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
