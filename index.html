<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DMassanger</title>
  <style>
    :root {
      --primary: #00796b; --bg-main: #e0f2f1; --bg-sidebar: #00796b;
      --bg-chat: #ffffff; --text-main: #333333; --text-sidebar: #ffffff;
      --my-msg: #b2dfdb; --other-msg: #f1f8e9; --border-color: #cccccc; --input-bg: #ffffff;
    }
    body.dark-theme {
      --primary: #00897b; --bg-main: #121212; --bg-sidebar: #1e1e1e;
      --bg-chat: #1e1e1e; --text-main: #e0e0e0; --text-sidebar: #e0e0e0;
      --my-msg: #004d40; --other-msg: #333333; --border-color: #333333; --input-bg: #2c2c2c;
    }
    body { margin: 0; font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; background: var(--bg-main); justify-content: center; align-items: center; color: var(--text-main); transition: background 0.3s; }
    
    /* ФОН */
    #auth-screen-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><text x="10" y="30" font-size="20" opacity="0.1">🐱</text><text x="60" y="70" font-size="20" opacity="0.1">🍩</text></svg>'); z-index: -1; }

    /* ВХОД */
    #auth-screen { background: var(--bg-chat); padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 350px; text-align: center; z-index: 1; }
    .logo { font-size: 54px; margin-bottom: 10px; }
    .title { color: var(--primary); font-size: 28px; margin-bottom: 20px; font-weight: bold; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { font-size: 12px; font-weight: bold; opacity: 0.8; margin-bottom: 5px; display: block; }
    #auth-screen input, #auth-screen select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--input-bg); color: var(--text-main); }
    #auth-screen button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
    .link { color: var(--primary); cursor: pointer; text-decoration: underline; font-size: 14px; margin-top: 15px; display: inline-block; }

    /* АВАТАРКИ */
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      color: white; font-weight: bold; font-size: 18px;
      text-transform: uppercase; flex-shrink: 0;
    }
    .avatar-sm { width: 30px; height: 30px; font-size: 14px; }
    .chat-header-avatar { width: 35px; height: 35px; font-size: 16px; margin-right: 10px; }

    /* ЧАТ */
    #app { display: none; width: 100%; height: 100%; }
    .sidebar { width: 280px; background: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; border-right: 1px solid var(--border-color); }
    .sidebar-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 18px; font-weight: bold; }
    .user-list { overflow-y: auto; flex: 1; }
    
    .user-item { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; transition: background 0.2s; }
    .user-item:hover, .user-item.active { background: rgba(0,0,0,0.2); }
    
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); }
    .chat-header { padding: 15px 20px; background: var(--bg-chat); border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 18px; display: flex; align-items: center; }
    
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; background-image: url('data:image/svg+xml;utf8,<svg width="150" height="150" xmlns="http://www.w3.org/2000/svg"><text x="20" y="40" font-size="24" opacity="0.05">🐱</text><text x="90" y="80" font-size="24" opacity="0.05">🍩</text></svg>'); background-attachment: local; }
    
    /* СООБЩЕНИЯ */
    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 80%; }
    .msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    
    .message { padding: 12px 16px; border-radius: 15px; position: relative; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.05); animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .msg-row.my .message { background: var(--my-msg); border-bottom-right-radius: 2px; }
    .msg-row.other .message { background: var(--other-msg); border-bottom-left-radius: 2px; }
    
    .message img { max-width: 100%; max-height: 300px; border-radius: 10px; cursor: pointer; object-fit: cover; margin-top: 5px; }
    .delete-btn { cursor: pointer; opacity: 0.3; font-size: 12px; position: absolute; bottom: -18px; right: 5px; transition: opacity 0.2s; }
    .msg-row:hover .delete-btn { opacity: 1; color: red; }

    /* ПОЛЕ ВВОДА */
    .input-area { display: flex; padding: 15px 20px; background: var(--bg-chat); border-top: 1px solid var(--border-color); align-items: center; gap: 10px; }
    .attach-btn { font-size: 24px; cursor: pointer; color: var(--primary); transition: transform 0.2s; }
    .attach-btn:hover { transform: scale(1.1); }
    .input-area input[type="text"] { flex: 1; padding: 15px; border: 1px solid var(--border-color); border-radius: 25px; background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; }
    .input-area button { padding: 12px 25px; background: var(--primary); color: white; border: none; border-radius: 25px; cursor: pointer; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>

<div id="auth-screen-bg"></div>

<div id="auth-screen">
  <div class="logo">🐱</div>
  <div class="title">DMassanger</div>
  
  <div class="form-group">
    <label>Имя пользователя</label>
    <input id="username" placeholder="Например, dev">
  </div>
  <div class="form-group">
    <label>Пароль</label>
    <input id="password" type="password" placeholder="••••••••">
  </div>
  <div class="form-group">
    <label>Язык / Language</label>
    <select id="lang-select"><option value="ru">Русский</option><option value="en">English</option></select>
  </div>
  <div class="form-group">
    <label>Тема / Theme</label>
    <select id="theme-select"><option value="light">Светлая</option><option value="dark">Тёмная</option></select>
  </div>

  <button onclick="login()">Войти</button>
  <div class="link" onclick="register()">Нет аккаунта? Зарегистрироваться</div>
  <div id="auth-error" style="color: #d32f2f; margin-top: 15px; font-size: 14px;"></div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-header" id="sidebar-title">Чаты</div>
    <div class="user-list" id="userList"></div>
  </div>
  
  <div class="chat-area">
    <div class="chat-header" id="chatHeader">
      <div class="avatar chat-header-avatar" id="header-avatar" style="display:none;"></div>
      <span id="header-text">Выберите чат</span>
    </div>
    <div id="chat-box"></div>
    
    <div class="input-area">
      <label class="attach-btn" for="file-input">📎</label>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadFile()">
      
      <input type="text" id="msg" placeholder="Ваше сообщение..." autofocus>
      <button onclick="send()" id="send-btn">Отправить</button>
    </div>
  </div>
</div>

<script>
let ws;
let myNick = "";
let currentChat = null;
const chatBox = document.getElementById("chat-box");
const inp = document.getElementById("msg");

const translations = {
  ru: { chats: "Чаты", chooseChat: "Выберите чат", placeholder: "Ваше сообщение...", send: "Отправить" },
  en: { chats: "Chats", chooseChat: "Select a chat", placeholder: "Your message...", send: "Send" }
};
let currentLang = 'ru';

// --- ГЕНЕРАТОР АВАТАРОК ---
// Создает красивый цвет на основе имени
function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const colors = ['#e53935', '#d81b60', '#8e24aa', '#5e35b1', '#3949ab', '#1e88e5', '#039be5', '#00acc1', '#00897b', '#43a047', '#fb8c00', '#f4511e'];
  return colors[Math.abs(hash) % colors.length];
}

// Генерирует HTML-элемент аватарки
function createAvatar(name, sizeClass = "") {
  const div = document.createElement("div");
  div.className = `avatar ${sizeClass}`;
  div.textContent = name.charAt(0);
  div.style.backgroundColor = getAvatarColor(name);
  return div;
}

document.getElementById("theme-select").addEventListener("change", (e) => {
  document.body.classList.toggle('dark-theme', e.target.value === 'dark');
});

async function auth(endpoint) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const lang = document.getElementById("lang-select").value;
  const theme = document.getElementById("theme-select").value;
  document.getElementById("auth-error").textContent = "";

  if (!username || !password) return document.getElementById("auth-error").textContent = "Заполните все поля!";

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");
    
    myNick = username;
    currentLang = lang;
    document.body.classList.toggle('dark-theme', theme === 'dark');
    applyLanguage(lang);

    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    connectWS();
  } catch (err) {
    document.getElementById("auth-error").textContent = err.message;
  }
}

function applyLanguage(lang) {
  document.getElementById("sidebar-title").textContent = translations[lang].chats;
  if(!currentChat) document.getElementById("header-text").textContent = translations[lang].chooseChat;
  inp.placeholder = translations[lang].placeholder;
  document.getElementById("send-btn").textContent = translations[lang].send;
}

function login() { auth("/login"); }
function register() { auth("/register"); }

function connectWS() {
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(`${wsProtocol}${location.host}/ws`);
  ws.onopen = () => ws.send(myNick);

  ws.onmessage = e => {
    const data = e.data;
    if (data.startsWith("SYSTEM_LIST:")) {
      const users = data.replace("SYSTEM_LIST:", "").split(",").filter(u => u !== myNick && u !== "");
      updateUserList(users);
    } else if (data.startsWith("DELETE_MSG:")) {
      document.getElementById(`msg-${data.split(":")[1]}`)?.remove();
    } else if (data.startsWith("MSG:")) {
      const parts = data.split(":");
      if (parts.length >= 6) {
        const to = parts[3];
        const text = parts.slice(4, parts.length - 1).join(":");
        const id = parts[parts.length - 1];
        const from = parts[2];
        
        if (to === currentChat || (from === currentChat && to === myNick)) {
          addMessage(from, text, id, from === myNick);
        }
      }
    }
  };
}

function updateUserList(users) {
  const list = document.getElementById("userList");
  list.innerHTML = users.length === 0 ? '<div style="padding: 20px; text-align: center; opacity: 0.5;">Нет других пользователей онлайн</div>' : '';
  
  users.forEach(user => {
    const div = document.createElement("div");
    div.className = "user-item";
    div.id = `chat-${user}`;
    
    // Добавляем аватарку в список
    const avatar = createAvatar(user, "avatar-sm");
    const nameSpan = document.createElement("span");
    nameSpan.textContent = user;
    
    div.appendChild(avatar);
    div.appendChild(nameSpan);
    div.onclick = function() { selectChat(user, this); };
    list.appendChild(div);
  });
}

function selectChat(target, element) {
  currentChat = target;
  
  // Обновляем заголовок чата с аватаркой
  const headerAvatar = document.getElementById("header-avatar");
  headerAvatar.style.display = "flex";
  headerAvatar.textContent = target.charAt(0);
  headerAvatar.style.backgroundColor = getAvatarColor(target);
  document.getElementById("header-text").textContent = target;
  
  document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
  element.classList.add("active");
  chatBox.innerHTML = "";
}

function send() {
  if (!currentChat) return alert("Сначала выберите, кому хотите написать");
  if (!inp.value.trim()) return;
  const id = Date.now().toString();
  ws.send(`${currentChat}|${inp.value}|${id}`);
  addMessage(myNick, inp.value, id, true);
  inp.value = "";
}

async function uploadFile() {
  if (!currentChat) {
    alert("Сначала выберите, кому хотите отправить картинку");
    document.getElementById("file-input").value = "";
    return;
  }

  const fileInput = document.getElementById("file-input");
  const file = fileInput.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    if (!res.ok) throw new Error("Ошибка загрузки");
    const data = await res.json();
    
    const id = Date.now().toString();
    const msgText = `IMG:${data.url}`;
    ws.send(`${currentChat}|${msgText}|${id}`);
    addMessage(myNick, msgText, id, true);
    
  } catch (err) {
    alert("Не удалось загрузить картинку: " + err.message);
  } finally {
    fileInput.value = ""; 
  }
}

function addMessage(from, text, id, isMe) {
  // Создаем общую строку для аватарки и сообщения
  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? 'my' : 'other'}`;
  row.id = `msg-${id}`;
  
  // Аватарка отправителя (для чужих сообщений показываем слева)
  if (!isMe) {
    const avatar = createAvatar(from, "avatar-sm");
    row.appendChild(avatar);
  }

  // Сам пузырь сообщения
  const bubble = document.createElement("div");
  bubble.className = "message";
  
  if (text.startsWith("IMG:")) {
    const imgUrl = text.replace("IMG:", "");
    const img = document.createElement("img");
    img.src = imgUrl;
    img.onclick = () => window.open(imgUrl, "_blank");
    bubble.appendChild(img);
  } else {
    const textSpan = document.createElement("span");
    textSpan.textContent = text;
    bubble.appendChild(textSpan);
  }
  
  // Кнопка удаления (только для своих)
  if (isMe) {
    const delBtn = document.createElement("span");
    delBtn.className = "delete-btn";
    delBtn.textContent = "🗑️";
    delBtn.onclick = () => { if (confirm("Удалить сообщение?")) ws.send(`DELETE:${id}`); };
    bubble.appendChild(delBtn);
  }
  
  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
