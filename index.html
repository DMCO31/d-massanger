<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>DMassanger</title>
  <style>
    /* --- ПЕРЕМЕННЫЕ И ГЛАССМОРФИЗМ --- */
    :root {
      --primary: #00897b;
      --bg-base: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --my-msg: #00897b;
      --other-msg: rgba(255, 255, 255, 0.7);
      --glass-bg: rgba(255, 255, 255, 0.4);
      --glass-border: rgba(255, 255, 255, 0.6);
      --input-bg: rgba(255, 255, 255, 0.6);
      --hover-bg: rgba(255, 255, 255, 0.5);
    }

    body.dark-theme {
      --primary: #26a69a;
      --bg-base: linear-gradient(135deg, #121212 0%, #1f2937 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --my-msg: #005c4b;
      --other-msg: rgba(255, 255, 255, 0.1);
      --glass-bg: rgba(20, 20, 20, 0.5);
      --glass-border: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(0, 0, 0, 0.2);
      --hover-bg: rgba(255, 255, 255, 0.05);
    }

    /* --- БАЗА --- */
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; height: 100vh; background: var(--bg-base); color: var(--text-main); overflow: hidden;
      transition: background 0.3s;
    }

    /* --- ЭФФЕКТ СТЕКЛА --- */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
    }

    /* --- ВХОД --- */
    #auth-screen {
      margin: auto; padding: 40px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 360px; text-align: center; z-index: 10;
    }
    .logo-big { font-size: 64px; color: var(--primary); font-weight: 300; line-height: 1; margin-bottom: 10px; }
    .title { font-size: 24px; margin-bottom: 25px; font-weight: 600; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { font-size: 13px; color: var(--text-muted); margin-bottom: 5px; display: block; }
    .input-group input, .input-group select {
      width: 100%; padding: 12px; border: 1px solid var(--glass-border);
      border-radius: 12px; background: var(--input-bg); color: var(--text-main);
      outline: none; font-size: 15px; transition: border 0.2s;
    }
    .input-group input:focus { border-color: var(--primary); }
    .btn-primary {
      width: 100%; padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 12px; cursor: pointer; font-size: 16px;
      font-weight: 600; margin-top: 10px; transition: transform 0.2s, opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
    .link { color: var(--primary); cursor: pointer; font-size: 14px; margin-top: 15px; display: inline-block; }
    #auth-error { color: #ef4444; margin-top: 15px; font-size: 14px; }

    /* --- ИНТЕРФЕЙС --- */
    #app { display: none; width: 100%; height: 100%; padding: 15px; gap: 15px; }

    .sidebar {
      width: 320px; border-radius: 24px; display: flex; flex-direction: column;
      overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05);
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; gap: 15px; }
    .logo-small { font-size: 32px; color: var(--primary); font-weight: 300; }
    .sidebar-title { font-size: 18px; font-weight: 600; flex: 1; }

    .user-list { flex: 1; overflow-y: auto; padding: 10px; }
    .user-item { padding: 12px 15px; cursor: pointer; border-radius: 14px; display: flex; align-items: center; gap: 12px; transition: background 0.2s; margin-bottom: 5px; }
    .user-item:hover { background: var(--hover-bg); }
    .user-item.active { background: var(--primary); color: white; }
    .user-item.active .avatar { background: rgba(255,255,255,0.2) !important; }

    .sidebar-footer { padding: 15px; border-top: 1px solid var(--glass-border); }
    .btn-settings {
      width: 100%; padding: 12px; background: var(--input-bg); color: var(--text-main);
      border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer;
      font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background 0.2s;
    }
    .btn-settings:hover { background: var(--hover-bg); }

    /* --- АВАТАРКИ --- */
    .avatar { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; text-transform: uppercase; flex-shrink: 0; }
    .avatar-sm { width: 32px; height: 32px; font-size: 14px; }

    /* --- ЧАТ --- */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      border-radius: 24px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.05);
      background: transparent;
    }
    .chat-header {
      padding: 15px 20px; border-bottom: 1px solid var(--glass-border);
      display: flex; align-items: center; gap: 15px; font-weight: 600; font-size: 18px;
      background: var(--glass-bg); backdrop-filter: blur(16px); z-index: 2;
    }
    .chat-header .avatar { display: none; }
    #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }

    /* --- СООБЩЕНИЯ --- */
    .msg-row { display: flex; align-items: flex-end; gap: 10px; max-width: 75%; }
    .msg-row.my { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.other { align-self: flex-start; }
    .message {
      padding: 10px 14px; border-radius: 16px; position: relative; word-break: break-word;
      font-size: 15px; line-height: 1.4; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      animation: slideIn 0.2s ease-out;
    }
    @keyframes slideIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .msg-row.my .message {
      background: var(--my-msg); color: white; border-bottom-right-radius: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .msg-row.other .message {
      background: var(--other-msg); color: var(--text-main); border-bottom-left-radius: 4px;
      border: 1px solid var(--glass-border);
    }

    .message img { max-width: 100%; max-height: 300px; border-radius: 12px; cursor: pointer; object-fit: cover; margin-top: 5px; display: block; }

    .delete-btn {
      cursor: pointer; opacity: 0; font-size: 12px; position: absolute; bottom: 5px; right: 5px;
      transition: opacity 0.2s; padding: 4px;
    }
    .msg-row:hover .delete-btn { opacity: 0.7; }
    .msg-row.my .delete-btn { color: white; }
    .delete-btn:hover { opacity: 1; }

    /* --- ПОЛЕ ВВОДА --- */
    .input-area {
      display: flex; padding: 15px 20px; border-top: 1px solid var(--glass-border);
      align-items: center; gap: 10px; background: var(--glass-bg);
      backdrop-filter: blur(16px); z-index: 2;
    }
    .icon-btn {
      background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted);
      transition: color 0.2s; display: flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 50%;
    }
    .icon-btn:hover { color: var(--primary); background: var(--input-bg); }
    .input-area input[type="text"] {
      flex: 1; padding: 12px 18px; border: 1px solid transparent; border-radius: 20px;
      background: var(--input-bg); color: var(--text-main); font-size: 15px;
      outline: none; transition: border 0.2s;
    }
    .input-area input[type="text"]:focus { border-color: var(--glass-border); }
    .input-area button.btn-send {
      background: var(--primary); color: white; border: none; border-radius: 50%;
      width: 42px; height: 42px; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    .input-area button.btn-send:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(0,137,123,0.3); }

    /* --- СТИКЕРЫ (ЭМОДЗИ) --- */
    .emoji-panel {
      position: absolute; bottom: 85px; right: 20px; border-radius: 16px; padding: 15px;
      display: none; grid-template-columns: repeat(6, 1fr); gap: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 5;
    }
    .emoji-panel.show { display: grid; }
    .emoji-btn { background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; border-radius: 8px; transition: background 0.2s; }
    .emoji-btn:hover { background: var(--input-bg); }

    /* --- НАСТРОЙКИ --- */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(4px); }
    .modal-overlay.show { display: flex; }
    .modal { padding: 30px; border-radius: 24px; width: 320px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    .modal h3 { margin-top: 0; color: var(--text-main); margin-bottom: 20px; text-align: center; }
    .modal .input-group { margin-bottom: 20px; }
    .btn-close { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--glass-border); border-radius: 12px; cursor: pointer; color: var(--text-main); font-weight: 600; transition: background 0.2s; }
    .btn-close:hover { background: var(--hover-bg); }
  </style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen" class="glass">
  <div class="logo-big">д</div>
  <div class="title">DMassanger</div>

  <div class="input-group">
    <label>Имя пользователя</label>
    <input id="username" placeholder="Введите логин">
  </div>
  <div class="input-group">
    <label>Пароль</label>
    <input id="password" type="password" placeholder="Введите пароль">
  </div>

  <button class="btn-primary" onclick="login()">Войти</button>
  <div class="link" onclick="register()">Создать аккаунт</div>
  <div id="auth-error"></div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="app">
  <div class="sidebar glass">
    <div class="sidebar-header">
      <div class="logo-small">д</div>
      <div class="sidebar-title" id="sidebar-title-text">Чаты</div>
    </div>
    <div class="user-list" id="userList"></div>
    <div class="sidebar-footer">
      <button class="btn-settings" onclick="openSettings()">⚙️ <span id="settings-text">Настройки</span></button>
    </div>
  </div>

  <div class="chat-area glass">
    <div class="chat-header">
      <div class="avatar" id="header-avatar"></div>
      <span id="header-name">Выберите чат</span>
    </div>

    <div id="chat-box"></div>

    <!-- Панель эмодзи -->
    <div class="emoji-panel glass" id="emojiPanel">
      <button class="emoji-btn" onclick="addEmoji('😀')">😀</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('👍')">👍</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('🎉')">🎉</button>
      <button class="emoji-btn" onclick="addEmoji('🐱')">🐱</button>
      <button class="emoji-btn" onclick="addEmoji('💩')">💩</button>
      <button class="emoji-btn" onclick="addEmoji('😎')">😎</button>
      <button class="emoji-btn" onclick="addEmoji('💯')">💯</button>
      <button class="emoji-btn" onclick="addEmoji('🤔')">🤔</button>
      <button class="emoji-btn" onclick="addEmoji('😢')">😢</button>
    </div>

    <div class="input-area">
      <button class="icon-btn" onclick="toggleEmoji()">😊</button>
      <label class="icon-btn" for="file-input" style="cursor:pointer;">📎</label>
      <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="uploadFile()">

      <input type="text" id="msg" placeholder="Сообщение..." autofocus>
      <button class="btn-send" onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal glass">
    <h3>Настройки</h3>

    <div class="input-group">
      <label>Язык / Language</label>
      <select id="settings-lang" onchange="changeLang(this.value)">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="input-group">
      <label>Тема / Theme</label>
      <select id="settings-theme" onchange="changeTheme(this.value)">
        <option value="light">Светлая / Light</option>
        <option value="dark">Тёмная / Dark</option>
      </select>
    </div>

    <div class="input-group">
      <label>Обои / Wallpaper</label>
      <select id="settings-wallpaper" onchange="changeWallpaper(this.value)">
        <option value="solid">Однотонные / Solid</option>
        <option value="pattern">Узор / Pattern</option>
      </select>
    </div>

    <button class="btn-close" onclick="closeSettings()">Закрыть</button>
  </div>
</div>

<script>
let ws;
let myNick = "";
let currentChat = null;
let currentLang = 'ru';
let currentTheme = 'light';
let currentWallpaper = 'solid';

const chatBox = document.getElementById("chat-box");
const inp = document.getElementById("msg");

const translations = {
  ru: { chats: "Чаты", choose: "Выберите чат", settings: "Настройки", close: "Закрыть" },
  en: { chats: "Chats", choose: "Select a chat", settings: "Settings", close: "Close" }
};

function applyLanguage(lang) {
  currentLang = lang;
  document.getElementById("sidebar-title-text").textContent = translations[lang].chats;
  document.getElementById("settings-text").textContent = translations[lang].settings;
  if(!currentChat) document.getElementById("header-name").textContent = translations[lang].choose;
  document.querySelector(".btn-close").textContent = translations[lang].close;
  inp.placeholder = lang === 'ru' ? "Сообщение..." : "Message...";
}

function applyTheme(theme) {
  currentTheme = theme;
  document.body.classList.toggle('dark-theme', theme === 'dark');
}

function applyWallpaper(wall) {
  currentWallpaper = wall;
  document.body.classList.toggle('wallpaper-pattern', wall === 'pattern');
}

function getAvatarColor(name) {
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  const colors = ['#00897b', '#1e88e5', '#8e24aa', '#d81b60', '#e53935', '#fb8c00', '#43a047', '#546e7a'];
  return colors[Math.abs(hash) % colors.length];
}

function createAvatar(name, sizeClass = "") {
  const div = document.createElement("div");
  div.className = `avatar ${sizeClass}`;
  div.textContent = name.charAt(0);
  div.style.backgroundColor = getAvatarColor(name);
  return div;
}

async function auth(endpoint) {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  document.getElementById("auth-error").textContent = "";

  if (!username || !password) return document.getElementById("auth-error").textContent = "Заполните все поля!";

  try {
    const res = await fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Ошибка");

    myNick = username;
    document.getElementById("auth-screen").style.display = "none";
    document.getElementById("app").style.display = "flex";
    connectWS();
  } catch (err) {
    document.getElementById("auth-error").textContent = err.message;
  }
}

function login() { auth("/login"); }
function register() { auth("/register"); }

function connectWS() {
  const wsProtocol = location.protocol === 'https:' ? 'wss://' : 'ws://';
  ws = new WebSocket(`${wsProtocol}${location.host}/ws`);
  ws.onopen = () => ws.send(myNick);

  ws.onmessage = e => {
    const data = e.data;
    if (data.startsWith("SYSTEM_LIST:")) {
      const users = data.replace("SYSTEM_LIST:", "").split(",").filter(u => u !== myNick && u !== "");
      updateUserList(users);
    } else if (data.startsWith("DELETE_MSG:")) {
      document.getElementById(`msg-${data.split(":")[1]}`)?.remove();
    } else if (data.startsWith("MSG:")) {
      const parts = data.split(":");
      if (parts.length >= 6) {
        const to = parts[3];
        const text = parts.slice(4, parts.length - 1).join(":");
        const id = parts[parts.length - 1];
        const from = parts[2];

        // ФИКС БАГА: Игнорируем свои же сообщения, пришедшие от сервера
        if (from === myNick) return;

        if (to === currentChat || (from === currentChat && to === myNick)) {
          addMessage(from, text, id, false);
        }
      }
    }
  };
}

function updateUserList(users) {
  const list = document.getElementById("userList");
  list.innerHTML = users.length === 0 ? '<div style="padding: 20px; text-align: center; color: var(--text-muted);">Нет пользователей онлайн</div>' : '';

  users.forEach(user => {
    const div = document.createElement("div");
    div.className = "user-item";
    div.id = `chat-${user}`;
    div.appendChild(createAvatar(user, "avatar-sm"));

    const nameSpan = document.createElement("span");
    nameSpan.textContent = user;
    div.appendChild(nameSpan);

    div.onclick = function() { selectChat(user, this); };
    list.appendChild(div);
  });
}

function selectChat(target, element) {
  currentChat = target;

  const headerAvatar = document.getElementById("header-avatar");
  headerAvatar.style.display = "flex";
  headerAvatar.textContent = target.charAt(0);
  headerAvatar.style.backgroundColor = getAvatarColor(target);
  document.getElementById("header-name").textContent = target;

  document.querySelectorAll(".user-item").forEach(el => el.classList.remove("active"));
  element.classList.add("active");
  chatBox.innerHTML = "";
}

function send() {
  if (!currentChat) return alert("Выберите собеседника!");
  if (!inp.value.trim()) return;

  const id = Date.now().toString();
  ws.send(`${currentChat}|${inp.value}|${id}`);

  // Рисуем сообщение у себя СРАЗУ
  addMessage(myNick, inp.value, id, true);
  inp.value = "";
}

async function uploadFile() {
  if (!currentChat) {
    alert("Выберите собеседника!");
    document.getElementById("file-input").value = "";
    return;
  }
  const fileInput = document.getElementById("file-input");
  const file = fileInput.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);

  try {
    const res = await fetch("/upload", { method: "POST", body: formData });
    if (!res.ok) throw new Error("Ошибка загрузки");
    const data = await res.json();

    const id = Date.now().toString();
    const msgText = `IMG:${data.url}`;
    ws.send(`${currentChat}|${msgText}|${id}`);
    addMessage(myNick, msgText, id, true);
  } catch (err) {
    alert("Ошибка: " + err.message);
  } finally {
    fileInput.value = "";
  }
}

function addMessage(from, text, id, isMe) {
  const row = document.createElement("div");
  row.className = `msg-row ${isMe ? 'my' : 'other'}`;
  row.id = `msg-${id}`;

  if (!isMe) row.appendChild(createAvatar(from, "avatar-sm"));

  const bubble = document.createElement("div");
  bubble.className = "message";

  if (text.startsWith("IMG:")) {
    const imgUrl = text.replace("IMG:", "");
    const img = document.createElement("img");
    img.src = imgUrl;
    img.onclick = () => window.open(imgUrl, "_blank");
    bubble.appendChild(img);
  } else {
    bubble.textContent = text;
  }

  if (isMe) {
    const delBtn = document.createElement("span");
    delBtn.className = "delete-btn";
    delBtn.textContent = "🗑️";
    delBtn.onclick = () => { if (confirm("Удалить сообщение?")) ws.send(`DELETE:${id}`); };
    bubble.appendChild(delBtn);
  }

  row.appendChild(bubble);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function toggleEmoji() {
  document.getElementById("emojiPanel").classList.toggle("show");
}

function addEmoji(emoji) {
  inp.value += emoji;
  inp.focus();
  document.getElementById("emojiPanel").classList.remove("show");
}

function openSettings() {
  document.getElementById("settings-lang").value = currentLang;
  document.getElementById("settings-theme").value = currentTheme;
  document.getElementById("settings-wallpaper").value = currentWallpaper;
  document.getElementById("settingsModal").classList.add("show");
}

function closeSettings() {
  document.getElementById("settingsModal").classList.remove("show");
}

function changeLang(val) { applyLanguage(val); }
function changeTheme(val) { applyTheme(val); }
function changeWallpaper(val) { applyWallpaper(val); }

inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
